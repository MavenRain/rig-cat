[package]
name = "rig-cat"
version = "0.1.1"
edition = "2024"
description = "LLM agent framework built on comp-cat-rs: typed effects, no async, categorical foundations"
license = "MIT"
keywords = ["llm", "agent", "category-theory", "effects", "ai"]
categories = ["science", "rust-patterns"]

[dependencies]
comp-cat-rs = "0.5"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = "warn"
needless_pass_by_value = "warn"
manual_map = "warn"
